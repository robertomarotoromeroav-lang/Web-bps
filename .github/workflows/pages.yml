name: Publicar prototipo en GitHub Pages

# El prototipo es HTML/CSS/JS plano, sin build: se sube el repositorio tal cual.
on:
  push:
    branches: [claude/bpsperformance-hyperice-styles-xop5k0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue cada vez, sin cancelar el que ya esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Requiere que Pages esté activado con origen "GitHub Actions"
      # (Settings → Pages → Source). El GITHUB_TOKEN no puede activarlo por sí
      # mismo, así que ese primer paso se hace una única vez a mano.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
